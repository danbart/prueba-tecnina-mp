version: "3.8"
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: "${DB_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql

  backend:
    build: ./backend
    environment:
      DB_USER: sa
      DB_PASS: ${DB_PASSWORD}
      DB_SERVER: ${DB_SERVER}
      DB_NAME: ${DB_NAME}
    depends_on:
      - sqlserver
    ports:
      - ${PORT}:${PORT}

  frontend:
    build: ./frontend
    ports:
      - ${PORT_FRONTEND}:${PORT_FRONTEND}
    depends_on:
      - backend

volumes:
  sqlserverdata:
